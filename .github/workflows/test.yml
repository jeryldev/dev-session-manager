name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh, tmux, bats and shellcheck (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh tmux bats shellcheck

      - name: Install tmux, bats and shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux bats-core shellcheck

      - name: Versions
        run: zsh --version; tmux -V; bats --version; git --version

      # ShellCheck does not support zsh (SC1071), so dev.zsh gets zsh's own
      # syntax check and install.sh, which is sh, gets ShellCheck.
      - name: Syntax
        run: zsh -n dev.zsh

      - name: ShellCheck install.sh
        run: shellcheck install.sh

      - name: Tests
        run: bats tests/

  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # DEV_VERSION, the tag and the tap formula are kept in step by hand; this
      # catches the first two disagreeing before the formula points at them.
      - name: DEV_VERSION matches the tag
        run: |
          version="$(grep -m1 '^DEV_VERSION=' dev.zsh | cut -d'"' -f2)"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "dev.zsh says ${version}, the tag is ${GITHUB_REF_NAME}" >&2
            exit 1
          }
